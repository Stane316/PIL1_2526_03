name: Django Check

on:
  push:
    branches:
      - develop
      - main
      - feature/integration-frontend-backend

  pull_request:
    branches:
      - develop
      - main

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Cloner le projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt  # Correction du chemin vers le dossier backend

      - name: Vérification Django
        run: |
          cd backend
          python manage.py check

      - name: Vérifier les migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run