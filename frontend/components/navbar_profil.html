<header class="navbar navbar-expand-md navbar-light bg-white border-bottom border-light px-4 py-3 shadow-sm d-flex justify-content-between align-items-center">
  <!-- Titre de la page dynamique -->
  <h5 class="mb-0 fw-bold text-dark">{{ titre_page|default:"Tableau de bord" }}</h5>
  
  <div class="d-flex align-items-center gap-3">
    <!-- Notifications rapides (facultatif, badge) -->
    <a href="{% url 'notifications' %}" class="text-muted position-relative me-2" title="Notifications">
      <i class="bi bi-bell fs-5"></i>
      <span class="position-absolute top-0 start-100 translate-middle p-1 bg-warning border border-white rounded-circle"></span>
    </a>

    <!-- Profil de l'utilisateur connecté -->
    <span class="small text-muted fw-medium">{{ profil.prenom }} {{ profil.nom }}</span>
    {% if profil.photo_profil %}
      <img src="{{ profil.photo_profil }}" class="rounded-circle border" width="36" height="36" alt="Avatar">
    {% else %}
      <img src="https://ui-avatars.com/api/?name={{ profil.prenom }}+{{ profil.nom }}&background=0B3C91&color=fff" class="rounded-circle border" width="36" height="36" alt="Avatar">
    {% endif %}
  </div>
</header>
