<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion / Inscription</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; }

    .btn-login {
      background: #111111;
      color: #ffffff;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-login:hover {
      background: #2d2d2d;
      transform: translateY(-1px);
    }

    .btn-signup {
      background: transparent;
      color: #4f46e5;
      border: 2px solid #4f46e5;
      transition: background 0.2s, color 0.2s, transform 0.15s;
    }
    .btn-signup:hover {
      background: #4f46e5;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .card {
      animation: fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon-ring {
      background: #4f46e5;
      box-shadow: 0 0 0 8px rgba(79,70,229,0.12);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center" style="background:#e8eef7;">

  <div class="card bg-white rounded-3xl shadow-lg px-10 py-12 w-full max-w-md flex flex-col items-center gap-8">

    <!-- Icon -->
    <div class="icon-ring w-14 h-14 rounded-full flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3L2 9l10 6 10-6-10-6zM2 15l10 6 10-6"/>
      </svg>
    </div>

    <!-- Heading -->
    <div class="text-center">
      <h1 class="text-2xl font-bold text-gray-900 mb-1">Bienvenue</h1>
      <p class="text-sm text-gray-500">Choisissez une option pour continuer</p>
    </div>

    <!-- Buttons -->
    <div class="w-full flex flex-col gap-4">
      <button class="btn-login w-full py-3.5 rounded-xl text-sm font-semibold tracking-wide">
        <a href="{% url 'connexion' %}">Login</a>
      </button>
      <button class="btn-signup w-full py-3.5 rounded-xl text-sm font-semibold tracking-wide">
        <a href="{% url 'inscription' %}">Sign Up</a>
      </button>
    </div>

    <!-- Footer hint -->
    <p class="text-xs text-gray-400 text-center">
      En continuant, vous acceptez nos
      <a href="#" class="text-indigo-600 hover:underline">Conditions d'utilisation</a>
    </p>

  </div>

</body>
</html>
