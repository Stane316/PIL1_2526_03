<div class="ml-page" data-page="reset">
  <div class="ml-auth-wrap">
    <aside class="ml-auth-side">
      <a href="#" class="ml-logo" data-nav="home" style="color:#fff;">
        <span class="ml-logo-mark"><i class="bi bi-mortarboard-fill"></i></span>
        MentorLink
      </a>
      <div style="position: relative; z-index: 2;">
        <h2 class="text-white" style="font-size: 2rem; line-height:1.2;">Réinitialisation sécurisée</h2>
        <p style="color: rgba(255,255,255,.8);" class="mt-3">Nous vous enverrons un lien sécurisé pour définir un nouveau mot de passe.</p>
      </div>
      <div class="small" style="color: rgba(255,255,255,.6); position: relative; z-index: 2;">© 2026 MentorLink — IFRI</div>
    </aside>
    <div class="ml-auth-form">
      <div class="ml-auth-card">
        <h3 class="mb-2">Mot de passe oublié ?</h3>
        <p class="text-muted-soft mb-4">Entrez votre email ou téléphone, nous vous enverrons un lien de réinitialisation.</p>
        <form onsubmit="event.preventDefault(); alert('Lien envoyé (démo).'); navigate('login');">
          <div class="mb-3">
            <label class="form-label">Email ou téléphone</label>
            <input type="text" class="form-control" placeholder="prenom.nom@ifri.uac.bj" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Envoyer le lien de réinitialisation</button>
          <p class="text-center mt-4 small">
            <a href="#" class="ml-link" data-nav="login"><i class="bi bi-arrow-left me-1"></i>Retour à la connexion</a>
          </p>
        </form>
      </div>
    </div>
  </div>
