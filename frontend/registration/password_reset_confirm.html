<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nouveau mot de passe - MentorÉtude</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-sm p-8 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Choisir un nouveau mot de passe</h1>
        <p class="text-gray-500 mb-6">Veuillez entrer votre nouveau mot de passe ci-dessous.</p>

        {% if form.errors %}
            <div class="p-2 mb-4 text-sm text-red-600 bg-red-50 rounded-lg">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <form method="post" action="" class="space-y-4 text-left">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Nouveau mot de passe</label>
                {{ form.password }}
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Confirmer le mot de passe</label>
                {{ form.confirm_password }}
            </div>
            <button type="submit" class="w-full bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition shadow-lg">
                Mettre à jour le mot de passe
            </button>
        </form>
    </div>
</body>
</html>
