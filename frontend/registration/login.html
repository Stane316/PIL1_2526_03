<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - MentorÉtude</title>
    <link rel="stylesheet" href="assets/css/globalfont.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-sm p-8 md:p-10 text-center">
        <div class="bg-indigo-600 w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path d="M12 14l9-5-9-5-9 5 9 5z" />
                <path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
            </svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-800">Connexion</h1>
        <p class="text-gray-500 mt-2 mb-8">Connectez-vous à votre compte</p>

        {% if messages %}
            <div class="mb-4 space-y-2">
                {% for message in messages %}
                    <p class="text-sm text-red-600 bg-red-50 p-2 rounded-lg border border-red-200">
                        {{ message }}
                    </p>
                {% endfor %}
            </div>
        {% endif %}

        <form id="loginForm" class="space-y-6 text-left" method="post" action="{% url 'connexion' %}">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Nom d'utilisateur</label>
                {{ form.username }}
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Mot de passe</label>
                {{ form.password }}
            </div>

            <button type="submit" 
                class="w-full text-center bg-black text-white font-bold py-3 rounded-lg hover:bg-gray-800 transition shadow-lg">
                <a href="{% url 'profil' %}">Se connecter</a>
            </button>
        </form>

        <p class="mt-6 text-sm text-gray-500">
            Pas encore de compte ? <a href="{% url 'inscription' %}" class="text-indigo-600 font-bold hover:underline">S'inscrire</a>
        </p>
        <a href="{% url 'password_reset' %}" class="mt-6 text-sm text-gray-500">Mot de passe oublié ?</a>
    </div>

    
</body>
</html>
