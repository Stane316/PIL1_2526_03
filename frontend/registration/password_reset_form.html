<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublié - MentorÉtude</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-sm p-8 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Mot de passe oublié</h1>
        <p class="text-gray-500 mb-6">Saisissez votre adresse email pour recevoir un lien de récupération.</p>

        <form method="post" class="space-y-6 text-left">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">Adresse Email</label>
                {{ form.email }}
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition shadow-lg">
                Envoyer le lien
            </button>
        </form>
    </div>
</body>
</html>
